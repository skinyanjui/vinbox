<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.5' fill='%23000'/%3E%3Cpath d='M5.5 9V8A2.5 2.5 0 0 1 8 5.5h1M15 5.5h1A2.5 2.5 0 0 1 18.5 8v1M18.5 15v1a2.5 2.5 0 0 1-2.5 2.5h-1M9 18.5H8A2.5 2.5 0 0 1 5.5 16v-1' fill='none' stroke='%23fff' stroke-width='1.6' stroke-linecap='round'/%3E%3Cg fill='%23fff'%3E%3Crect x='8.4' y='9.5' width='1.4' height='5'/%3E%3Crect x='10.8' y='9.5' width='.9' height='5'/%3E%3Crect x='12.6' y='9.5' width='1.8' height='5'/%3E%3Crect x='15.2' y='9.5' width='.9' height='5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VIN Scanner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>VINBOX — VIN Scanner</title>
<meta name="description" content="Find a vehicle by VIN, check recalls, and save vehicles on this device.">
<!-- Use platform-native fonts: no render-blocking cross-origin font stylesheet. -->
<link rel="preconnect" href="https://vpic.nhtsa.dot.gov" crossorigin>
<link rel="stylesheet" href="styles.css?v=42">
<!-- Fetch ordered deferred app modules while the document is still parsing. -->
<script src="backup.js" defer></script>
<script src="epa-match.js" defer></script>
<script src="epa.js" defer></script>
<script src="ui.js" defer></script>
<script src="vehicle-recalls.js" defer></script>
<script src="vin-lookup.js?v=42" defer></script>
<script src="extras.js" defer></script>
<script src="app.js?v=42" defer></script>
</head>
<body>
<a class="skip" href="#vin-input">Skip to VIN entry</a>
<div class="wrap">
  <header class="top">
    <a class="brand" id="home-link" href="./" aria-label="VIN Scanner, go to start">
      <i data-icon="logo"></i>
      <span class="brand-wordmark">VIN Scanner</span>
    </a>
    <div class="scanner-nav"><a class="scanner-cars-link" id="scanner-cars-link" href="marketplace.html#browse"><i data-icon="car"></i><span>Cars</span></a>
    <div class="tabs" role="tablist" aria-label="Vehicle views" id="tabs"></div></div>
  </header>

  <section class="entry" aria-label="VIN entry">
    <label class="sr" for="vin-input">Vehicle identification number</label>
    <textarea id="vin-input" rows="1" autocomplete="off" autocapitalize="characters" spellcheck="false"
      placeholder="Enter or paste one or more VINs"></textarea>
    <div class="entry-bar">
      <div class="hint" id="hint" aria-live="polite">A VIN has 17 characters.</div>
      <button class="btn icon" id="photo-btn" title="Scan from photo" aria-label="Scan from photo">
        <i data-icon="image"></i>
      </button>
      <button class="btn tinted" id="scan-btn" aria-label="Scan with camera">
        <i data-icon="scan"></i>
        <span class="lbl-d">Scan</span>
      </button>
      <button class="btn primary" id="decode-btn" disabled>Find vehicles</button>
    </div>
  </section>
  <input type="file" id="photo-file" accept="image/*" hidden>
  <input type="file" id="saved-import" accept=".json,application/json" aria-label="Restore saved VINBOX vehicles from a JSON backup" hidden>

  <div id="tokens" class="tokens" hidden></div>
  <div id="err" class="err" hidden role="alert"></div>
  <main id="out" role="tabpanel" aria-labelledby="tab-results" tabindex="0"></main>
</div>

<div class="scan" id="scan" data-on="false" role="dialog" aria-modal="true" aria-label="Camera scanner">
  <video id="video" playsinline muted aria-label="Live camera preview"></video>
  <div class="reticle" aria-hidden="true"></div>
  <div class="scan-top">
    <button class="btn dark" id="scan-close"><i data-icon="x"></i>Close</button>
    <div class="scan-right">
      <button class="btn dark icon" id="fx-btn" aria-label="Sound and haptics"><i data-icon="sound"></i></button>
      <button class="btn dark" id="torch-btn" aria-pressed="false"><i data-icon="bolt"></i>Light</button>
    </div>
  </div>
  <div class="scan-foot"><p id="scan-msg" aria-live="polite">Point at the VIN barcode on the door jamb or windshield</p></div>
</div>
<div class="toast" id="toast" role="status"></div>

<template id="scanner-empty-template">
  <div class="empty"><b data-slot="heading"></b></div>
</template>
<template id="scanner-section-template">
  <div class="sec"><h2 data-slot="heading"></h2><div class="acts" data-slot="actions"></div></div>
</template>

</body>
</html>
