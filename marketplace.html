<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff">
<title>Cars · VINBOX</title>
<meta name="description" content="Enter a VIN to fill in your vehicle details and start a private listing.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=41">
<link rel="stylesheet" href="marketplace.css?v=41">
<script src="ui.js" defer></script>
<script src="vehicle-recalls.js" defer></script>
<script src="epa-match.js" defer></script>
<script src="epa.js" defer></script>
<script src="vin-lookup.js?v=41" defer></script>
<script src="marketplace-core.js?v=41" defer></script>
<script src="marketplace-samples.js" defer></script>
<script src="marketplace-components.js?v=41" defer></script>
<script src="marketplace.js?v=41" defer></script>
</head>
<body class="market-body">
<a class="skip" href="#market-main">Skip to listings</a>
<header class="market-nav">
 <div class="market-nav-inner">
  <a class="market-brand" href="./" aria-label="VINBOX scanner home" title="VIN scanner">
   <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 8.5V7A2.5 2.5 0 0 1 7 4.5h1.5M15.5 4.5H17A2.5 2.5 0 0 1 19.5 7v1.5M19.5 15.5V17a2.5 2.5 0 0 1-2.5 2.5h-1.5M8.5 19.5H7a2.5 2.5 0 0 1-2.5-2.5v-1.5M8 12h8"/></svg>
   <span class="brand-wordmark">VINBOX</span>
  </a>
  <form id="market-search" class="market-nav-search" role="search" aria-label="Marketplace">
   <input type="search" aria-label="Search vehicles or locations" placeholder="Search make, model, city or VIN" spellcheck="false" maxlength="120" enterkeyhint="search" autocomplete="off">
   <button type="submit" aria-label="Search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.4 15.4 4.1 4.1"/></svg>
   </button>
  </form>
  <nav aria-label="Marketplace navigation" class="market-links">
   <a href="#browse" data-nav="browse" aria-label="Browse" title="Browse">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10.5 8.5-7 8.5 7v9.5h-6v-6h-5v6h-6z"/></svg>
   </a>
   <a href="#saved" data-nav="saved" aria-label="Saved" title="Saved">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16l-6-4-6 4z"/></svg>
   </a>
   <a href="#new" class="market-sell" data-nav="new" aria-label="Sell a car" title="Sell a car">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Sell a car</span>
   </a>
   <a href="#profile" data-nav="profile" aria-label="Account and sign in" title="Account / Sign in">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"/></svg>
   </a>
  </nav>
 </div>
</header>
<main id="market-main" class="market-main" tabindex="-1"></main>
<div id="market-status" class="market-status" role="status" aria-live="polite"></div>
<footer class="market-footer"><span>VINBOX Cars</span><a href="./">Back to VIN scanner</a></footer>
<template id="market-browse-template">
 <div class="market-browse">
   <h1 class="market-visually-hidden">Cars</h1>
   <div class="market-search-tools">
    <span class="market-muted market-count" role="status" aria-live="polite" data-slot="count"></span>
    <label class="market-sort-label" for="market-sort">Sort
     <select id="market-sort" data-slot="sort">
      <option value="relevant">Best match</option>
      <option value="newest">Newest</option>
      <option value="price-asc">Lowest price</option>
      <option value="price-desc">Highest price</option>
      <option value="mileage-asc">Lowest mileage</option>
     </select>
    </label>
   </div>
   <div class="market-type-filters" data-slot="types" role="group" aria-label="Vehicle type"></div>
   <div class="market-cards" data-slot="cards"></div>
  </div>
</template>
<template id="market-mine-template">
 <div><h1 class="market-visually-hidden">My listings</h1><p class="market-storage-note">Your listings and photos stay on this device. A VIN backup saves only vehicles.</p><div class="market-stacked" data-slot="listings"></div></div>
</template>
<template id="market-card-template">
 <article class="market-card">
  <div class="market-card-photo-link" data-slot="media">
   <div class="market-card-overlay" data-slot="overlay">
    <span class="market-card-price-chip" data-slot="price"></span>
   </div>
  </div>
  <div class="market-card-title"><a data-slot="title"></a></div>
  <p class="market-card-meta" data-slot="facts"></p>
  <p class="market-card-meta market-card-location" data-slot="location" hidden></p>
  <p class="market-card-meta market-card-disclosure" data-slot="titleStatus"></p>
  <p class="market-card-meta" data-slot="status" hidden></p>
 </article>
</template>
<template id="market-save-template">
 <button type="button" class="market-save vinbox-save" aria-pressed="false">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16l-6-4-6 4z"/></svg>
  <span data-slot="label"></span>
 </button>
</template>
<template id="market-heading-template">
 <div class="market-intro"><h1 data-slot="heading"></h1></div>
</template>
<template id="market-vin-picker-template">
 <div class="market-editor market-vin-picker">
  <h1 class="market-heading">Sell a car</h1>
  <form class="market-vin-form" novalidate>
   <label for="market-vin">Vehicle identification number (VIN)</label>
   <div class="market-vin-entry">
    <input id="market-vin" type="text" maxlength="35" placeholder="Enter or paste a VIN" autocapitalize="characters" autocomplete="off" spellcheck="false" enterkeyhint="search" aria-describedby="market-vin-feedback" data-slot="input" required>
    <button class="market-primary" type="submit" data-slot="find">Find vehicle</button>
   </div>
   <p class="market-vin-feedback market-muted" id="market-vin-feedback" role="status" data-slot="feedback">Enter all 17 characters.</p>
   <a class="market-text-link" href="./?sell=1">Open VIN scanner</a>
  </form>
  <section class="market-vin-history">
   <h2 data-slot="historyHeading">Scanned and saved vehicles</h2>
   <p class="market-muted" data-slot="empty">Vehicles you look up or save appear here.</p>
   <ul class="market-vin-choices" data-slot="vehicles"></ul>
  </section>
 </div>
</template>
<template id="market-vin-choice-template">
 <li><button type="button" class="market-vin-choice">
  <span><strong data-slot="name"></strong><code data-slot="vin"></code></span>
  <span class="market-vin-choice-action" data-slot="action"></span>
 </button></li>
</template>
<template id="market-profile-template">
 <div class="market-editor market-profile">
  <h1 class="market-heading">Account</h1>
  <div class="market-account-links">
   <a href="#mine" class="market-account-listings"><span>My listings</span><span data-slot="listingCount">Manage listings</span></a>
  </div>
  <section class="market-account-access" aria-label="Account access">
   <h2>Sign in</h2>
   <p class="market-muted">Accounts aren't available in this private preview. Your seller details and listings stay on this device.</p>
  </section>
  <form class="market-form" novalidate>
   <div>
    <h2>Seller details</h2>
    <p class="market-muted">Save your seller details on this device to fill in new listings.</p>
   </div>
   <div class="market-fields-two">
    <div class="market-field">
     <label for="market-profile-type">Seller type</label>
     <select id="market-profile-type" data-slot="type"><option value="private">Private seller</option><option value="dealership">Dealership</option></select>
    </div>
    <div class="market-field">
     <label for="market-profile-name" data-slot="nameLabel">Seller name</label>
     <input id="market-profile-name" maxlength="80" data-slot="name" aria-describedby="market-profile-feedback">
    </div>
   </div>
   <div class="market-actions">
    <button class="market-primary" type="submit">Save profile</button>
    <p class="market-muted" id="market-profile-feedback" role="status" data-slot="feedback"></p>
   </div>
  </form>
 </div>
</template>
<template id="market-empty-template">
 <section class="market-empty"><h2 data-slot="heading"></h2><p data-slot="description"></p></section>
</template>
<template id="market-field-template">
 <div class="market-field"><label data-slot="label"></label><small data-slot="error" aria-live="polite"></small></div>
</template>
<template id="market-editor-template">
 <div class="market-editor">
  <form class="market-form" novalidate>
   <div class="market-edit-fields" data-slot="fields"></div>
   <label class="market-check"><input type="checkbox" id="m-authorized" aria-describedby="err-authorized" data-slot="permission"><span>I am the owner or authorized to sell this vehicle. The photos and disclosures are accurate to the best of my knowledge.</span></label>
   <small id="err-authorized" aria-live="polite" class="market-muted"></small>
   <p class="market-alert" hidden role="alert" data-slot="errors"></p>
   <div class="market-actions"><button type="submit" class="market-primary">Preview listing</button><span class="market-muted">Only on this device · Not published</span></div>
  </form>
 </div>
</template>
<template id="market-detail-header-template">
 <div class="market-detail-header">
  <a class="market-back" data-slot="back" href="#browse"></a>
  <h1 class="market-heading" data-slot="heading"></h1>
  <p class="market-subtitle" data-slot="location"></p>
  <div class="market-detail-price-row">
   <strong class="market-detail-price" data-slot="price"></strong>
   <div class="market-detail-actions" data-slot="actions"></div>
  </div>
  <div data-slot="fees"></div>
  <div data-slot="facts"></div>
  <div class="market-detail-vin" data-slot="vin" hidden><span>VIN</span><code data-slot="vinValue"></code></div>
 </div>
</template>
<template id="market-section-template">
 <section class="market-detail-section"><h2 data-slot="heading"></h2><div data-slot="body"></div></section>
</template>
<template id="market-disclosure-template">
 <details class="market-specifications"><summary data-slot="heading"></summary><div data-slot="body"></div></details>
</template>
<template id="market-gallery-template">
 <div class="market-carousel-view" role="region" aria-roledescription="carousel">
  <div class="market-carousel-track" data-slot="track"></div>
  <button class="market-carousel-arrow market-carousel-prev" type="button" aria-label="Previous photo" data-slot="previous">‹</button>
  <button class="market-carousel-arrow market-carousel-next" type="button" aria-label="Next photo" data-slot="next">›</button>
  <span class="market-carousel-count" data-slot="count" aria-live="polite"></span>
 </div>
</template>
<template id="market-photo-view-template">
 <div class="market-photo-page">
  <a class="market-back" data-slot="back">← Back to listing</a>
  <h1 class="market-heading" data-slot="heading"></h1>
  <div class="market-detail-gallery market-full-gallery" data-slot="gallery"></div>
 </div>
</template>
</body>
</html>
