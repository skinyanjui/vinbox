name: Mobile Network Performance Benchmark
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mobile-performance.yml
      - scripts/mobile-benchmark.cjs
      - scripts/wait-for-production.cjs
      - tests/load-performance.test.cjs
      - index.html
      - styles.css
      - sw.js
      - vercel.json
      - app.js
      - backup.js
      - epa-match.js
      - epa.js
      - extras.js
      - marketplace.html
      - marketplace.css
      - marketplace-core.js
      - marketplace-samples.js
      - marketplace-media/**
      - marketplace.js
      - scripts/marketplace-smoke.cjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-benchmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile-benchmark:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome automation dependency
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Wait for matching production deployment
        env:
          BENCHMARK_URL: https://vinbox-eight.vercel.app/
        run: node scripts/wait-for-production.cjs
      - name: Smoke-test VIN-to-sale flow in mobile Chrome
        env:
          BENCHMARK_URL: https://vinbox-eight.vercel.app/
        run: node scripts/marketplace-smoke.cjs
      - name: Run live VINBOX mobile performance benchmark
        env:
          BENCHMARK_URL: https://vinbox-eight.vercel.app/
          BENCHMARK_RUNS: "3"
        run: node scripts/mobile-benchmark.cjs
      - name: Upload raw mobile timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinbox-mobile-performance
          path: reports/mobile-performance.json
          if-no-files-found: warn
          retention-days: 14
